[changelog]
header = ""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | trim }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^[a-zA-Z]+(\\([^)]*\\))?!:", group = "🚫 Removed" },
  { body = "(?s).*BREAKING CHANGE:.*", group = "🚫 Removed" },
  { message = "^feat\\(deprecate\\)", group = "⚠️ Deprecated" },
  { message = "^chore\\(deprecate\\)", group = "⚠️ Deprecated" },
  { message = "^fix\\(security\\)", group = "🔒 Security" },
  { message = "^security", group = "🔒 Security" },
  { message = "^feat", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^improvement", group = "🧰 Improvements" },
  { message = "^perf", group = "🧰 Improvements" },
  { message = "^style", group = "💄 Style" },
  { message = "^docs?", group = "📚 Documentation" },
  { message = "^test", group = "🧪 Tests" },
  { message = "^ci", group = "👷 CI" },
  { message = "^chore", group = "🔧 Chore" },
  { message = "^refactor", group = "♻️ Refactor" },
  { message = ".*", group = "💼 Other" },
]
