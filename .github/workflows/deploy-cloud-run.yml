name: deploy-cloud-run

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de la imagen en Docker Hub (vacío = sha-<commit>; evitá latest por la caché de Docker Hub)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-cloud-run
    runs-on: ubuntu-latest
    if: >-
      vars.GCP_PROJECT_ID != '' &&
      vars.DOCKERHUB_USERNAME != '' &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
      vars.GCP_SERVICE_ACCOUNT != ''
    environment: production
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Despliega en Cloud Run
        id: deploy
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'tareas-blazor' }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="sha-${GITHUB_SHA}"
          fi

          IMAGE="docker.io/${DOCKERHUB_USERNAME}/tareas-blazor:${IMAGE_TAG}"
          echo "Imagen: $IMAGE" >> "$GITHUB_STEP_SUMMARY"

          MIRROR="https://mirror.gcr.io/v2/${DOCKERHUB_USERNAME}/tareas-blazor/manifests/${IMAGE_TAG}"
          for intento in $(seq 1 30); do
            if curl --fail --silent --show-error --head \
              --header "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json" \
              "$MIRROR" >/dev/null; then
              break
            fi
            if [ "$intento" -eq 30 ]; then
              echo "La imagen no está disponible en el mirror de Cloud Run." >&2
              exit 1
            fi
            echo "Esperando a que el mirror de Cloud Run sincronice la imagen ($intento/30)..."
            sleep 10
          done

          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --platform=managed \
            --port=8080 \
            --allow-unauthenticated \
            --set-env-vars "ASPNETCORE_ENVIRONMENT=Production,DATA_DIR=/tmp/data,Storage__UploadsPhysicalPath=/tmp/uploads" \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=80 \
            --min-instances=0 \
            --max-instances=1 \
            --timeout=3600 \
            --quiet

          URL=$(gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Cloud Run desplegado en $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verifica la salud del servicio
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 6 --retry-all-errors \
            "$URL/health"
